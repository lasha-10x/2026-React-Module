<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="10X Shop - a demo online store built with React, TypeScript and Tailwind CSS." />
    <title>10X Shop</title>
    <!-- Open the connections to the API and the image CDN early: the catalog needs both right away. -->
    <link rel="preconnect" href="https://dummyjson.com" crossorigin />
    <link rel="preconnect" href="https://cdn.dummyjson.com" crossorigin />
    <script>
      // Apply the saved theme before the first paint to avoid a light/dark flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("shop_theme"));
          var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
